<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#151517" />
    <title>CodeShell · 暂时离线</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0b0b0c;
        color: #e7e7e9;
        font:
          16px system-ui,
          sans-serif;
      }
      main {
        max-width: 28rem;
        padding: 2rem;
      }
      h1 {
        font-size: 1.5rem;
      }
      p {
        color: #a1a1aa;
        line-height: 1.7;
      }
      a {
        display: inline-block;
        background: #3b82f6;
        color: white;
        text-decoration: none;
        padding: 0.7rem 1.2rem;
        border-radius: 0.6rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>工作空间暂时离线</h1>
      <p>检查网络与服务端连接后重试。会话保存在服务端，重新连接后即可继续。</p>
      <a href="">重新连接</a>
    </main>
  </body>
</html>
