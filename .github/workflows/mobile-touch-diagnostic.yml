name: mobile project lifecycle diagnostic

on:
  push:
    branches: [codex/web/mobile-touch-ci-diagnostic]

permissions:
  contents: read

jobs:
  project-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "22.16.0"
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - name: Install the same locked Chromium as desktop-ui
        working-directory: packages/desktop
        run: |
          node node_modules/playwright/cli.js install --with-deps chromium
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { accessSync, constants, appendFileSync } from 'node:fs';
          const browser = chromium.executablePath();
          accessSync(browser, constants.X_OK);
          for (const key of ['CHROME_PATH', 'CODESHELL_TEST_CHROMIUM']) appendFileSync(process.env.GITHUB_ENV, `${key}=${browser}\n`);
          NODE
      - name: Build the reviewed workspace import boundaries
        run: bun run build
      - name: Project lifecycle and real touch with causal negative controls
        shell: bash
        run: |
          export TMPDIR="$RUNNER_TEMP/mobile-project-diagnostic"
          mkdir -p "$TMPDIR"
          node --version > "$TMPDIR/runtime.txt"
          "$CODESHELL_TEST_CHROMIUM" --version >> "$TMPDIR/runtime.txt"
          git rev-parse HEAD >> "$TMPDIR/runtime.txt"
          python3 - <<'PYCODE'
          import json, os, pathlib, subprocess
          directory = pathlib.Path(os.environ['TMPDIR'])
          runner = ['node', 'scripts/run-isolated-node-smoke.mjs']
          project = 'packages/web/scripts/test-project-workbench-back-browser.mjs'
          reports = []
          def run(name, args, *, failure=None, phase=None):
              log = directory / (name + '.log')
              with log.open('w') as output:
                  result = subprocess.run(runner + args, stdout=output, stderr=subprocess.STDOUT, timeout=120)
              text = log.read_text()
              receipt = {'name': name, 'exit': result.returncode, 'log': str(log)}
              reports.append(receipt)
              (directory / 'project-diagnostic-receipt.json').write_text(json.dumps(reports, indent=2) + '\n')
              print(json.dumps(receipt), flush=True)
              if failure is None:
                  assert result.returncode == 0, text[-16000:]
              else:
                  assert result.returncode != 0 and failure in text, text[-16000:]
                  if phase: assert '"phase":"' + phase + '"' in text, text[-16000:]
              return text
          for mode, extra in [('production', []), ('development', ['--development'])]:
              run('project-held-' + mode, [project] + extra)
              run('project-immediate-' + mode, [project, '--immediate-configuration'] + extra)
              run('links-touch-' + mode, ['packages/web/scripts/test-links-browser.mjs', '--case=touch-scroll'] + extra)
              run('skills-touch-' + mode, ['packages/web/scripts/test-skills-browser.mjs', '--case=scroll'] + extra)
          controller = pathlib.Path('packages/web/app/useHubController.tsx')
          navigation = pathlib.Path('packages/web/app/useWorkbenchNavigation.ts')
          original_controller = controller.read_bytes()
          original_navigation = navigation.read_text()
          try:
              controller.write_bytes(subprocess.check_output(['git', 'show', '44b372a498fd35d6291e9dc758c18d4437c640d7:packages/web/app/useHubController.tsx']))
              run('negative-late-metadata', [project, '--development'], failure='late workspace metadata must not retire a same-project Panel confirmation', phase='release-B-metadata')
          finally:
              controller.write_bytes(original_controller)
          marker = 'if (selected.projectId) url.searchParams.set("project", selected.projectId);'
          assert original_navigation.count(marker) == 1
          try:
              navigation.write_text(original_navigation.replace(marker, 'if (selected.projectId) { /* diagnostic: omit project URL normalization */ }', 1))
              run('negative-wrong-scope', [project, '--development'], failure='Old history must not overwrite the active ProjectsGate project URL', phase='cross-project-history')
          finally:
              navigation.write_text(original_navigation)
          assert controller.read_bytes() == original_controller
          assert navigation.read_text() == original_navigation
          subprocess.run(['git', 'diff', '--exit-code', '--', 'packages/web'], check=True)
          PYCODE
      - name: Preserve only isolated browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-project-lifecycle-diagnostic
          path: |
            ${{ runner.temp }}/mobile-project-diagnostic/*.log
            ${{ runner.temp }}/mobile-project-diagnostic/*.json
            ${{ runner.temp }}/mobile-project-diagnostic/runtime.txt
            ${{ runner.temp }}/mobile-project-diagnostic/**/failure.json
            ${{ runner.temp }}/mobile-project-diagnostic/**/failure.png
            ${{ runner.temp }}/mobile-project-diagnostic/**/receipt.json
          retention-days: 7
          if-no-files-found: warn
