name: mobile consumer diagnostic

on:
  push:
    branches: [codex/web/mobile-touch-ci-diagnostic]

permissions:
  contents: read

jobs:
  consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.4"
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - name: Install the locked Chromium and permit only its sandbox namespace
        working-directory: packages/desktop
        run: |
          node node_modules/playwright/cli.js install --with-deps chromium
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { writeFileSync, appendFileSync } from 'node:fs';
          const browser=chromium.executablePath();
          appendFileSync(process.env.GITHUB_ENV, `CODESHELL_TEST_CHROMIUM=${browser}\n`);
          writeFileSync('/tmp/codeshell-consumer-chromium.apparmor', `abi <abi/4.0>,\ninclude <tunables/global>\nprofile codeshell-consumer-ci "${browser}" flags=(unconfined) {\n  userns,\n}\n`);
          NODE
          sudo apparmor_parser -r /tmp/codeshell-consumer-chromium.apparmor
      - name: Build the reviewed workspace import boundaries
        run: bun run build
      - name: Check out the reviewed Video Download consumer
        uses: actions/checkout@v7
        with:
          repository: cjhyy/codeshell-panel-apps
          ref: 84348855be8ae4e5a31936b3c2b0d1d21410bd64
          path: .mobile-panel-consumer
          persist-credentials: false
      - name: Compare original mouse and single focused touch with a suppressed-click control
        shell: bash
        run: |
          export TMPDIR="$RUNNER_TEMP/mobile-consumer-diagnostic"
          mkdir -p "$TMPDIR"
          node --version > "$TMPDIR/runtime.txt"
          "$CODESHELL_TEST_CHROMIUM" --version >> "$TMPDIR/runtime.txt"
          git rev-parse HEAD >> "$TMPDIR/runtime.txt"
          git -C .mobile-panel-consumer rev-parse HEAD >> "$TMPDIR/runtime.txt"
          python3 - <<'PYCODE'
          from pathlib import Path
          import subprocess
          scripts=Path('scripts')
          runner=(scripts/'run-mobile-video-download.mjs').read_text()
          original=subprocess.check_output(['git','show','9ad80260d2e49518f8d601e4ce173daa418589f4:scripts/smoke-mobile-video-download.mjs'],text=True)
          current=(scripts/'smoke-mobile-video-download.mjs').read_text()
          marker='  phase = "single focused inspect tap / RPC";'
          assert current.count(marker)==1
          negative=current.replace(marker,'  await frame.locator("#inspect-button").evaluate((button) => {\n    button.addEventListener("click", (event) => {\n      event.preventDefault();\n      event.stopImmediatePropagation();\n    }, true);\n  });\n'+marker,1)
          for name,source in [('old',original),('suppressed',negative)]:
              target=f'.diagnostic-video-{name}.mjs'
              (scripts/target).write_text(source)
              (scripts/f'.diagnostic-video-{name}-runner.mjs').write_text(runner.replace('scripts/smoke-mobile-video-download.mjs',f'scripts/{target}'))
          PYCODE
          trap 'rm -f scripts/.diagnostic-video-*.mjs' EXIT
          if node scripts/run-isolated-node-smoke.mjs scripts/.diagnostic-video-old-runner.mjs .mobile-panel-consumer/apps/video-download > "$TMPDIR/old-mouse.log" 2>&1; then old_status=0; else old_status=$?; fi
          if node scripts/run-isolated-node-smoke.mjs scripts/run-mobile-video-download.mjs .mobile-panel-consumer/apps/video-download > "$TMPDIR/focused-touch.log" 2>&1; then touch_status=0; else touch_status=$?; fi
          if node scripts/run-isolated-node-smoke.mjs scripts/.diagnostic-video-suppressed-runner.mjs .mobile-panel-consumer/apps/video-download > "$TMPDIR/suppressed-click.log" 2>&1; then suppressed_status=0; else suppressed_status=$?; fi
          python3 - "$TMPDIR" "$old_status" "$touch_status" "$suppressed_status" <<'PYCODE'
          import json,pathlib,sys,re
          directory=pathlib.Path(sys.argv[1]);old_status,touch_status,suppressed_status=map(int,sys.argv[2:])
          positive=(directory/'focused-touch.log').read_text();negative=(directory/'suppressed-click.log').read_text()
          reports=[]
          for line in positive.splitlines():
              try: reports.append(json.loads(line))
              except (ValueError,TypeError): pass
          consumer=next((x for x in reports if x.get('panel')=='video-download'),None)
          receipt={'oldMouseExit':old_status,'focusedTouchExit':touch_status,'suppressedClickExit':suppressed_status,'consumer':consumer}
          (directory/'consumer-diagnostic-receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt))
          assert touch_status==0 and 'consumer: natural Node exit 0' in positive,positive[-16000:]
          assert consumer and consumer['exactDownloadBytes']==151552 and consumer['singleTrustedFocusedInspectTap'] and consumer['inspectionRpcReceived']
          assert consumer['unauthorizedDownloadDenied'] and consumer['revokedDownloadDenied'] and consumer['errors']==[] and consumer['blocked']==[]
          assert suppressed_status!=0 and 'single focused inspect tap / RPC' in negative,negative[-16000:]
          errors=[]
          for line in negative.splitlines():
              try: errors.append(json.loads(line))
              except (ValueError,TypeError): pass
          failure=next(x for x in errors if x.get('phase')=='single focused inspect tap / RPC')
          timeout=re.search(r'page.waitForRequest: Timeout (\d+)ms exceeded',failure['error'])
          assert timeout and 0<int(timeout.group(1))<=30000,failure['error']
          for kind in ['touchstart','touchend','click']:
              events=[e for e in failure['inputEvents'] if e.get('kind')==kind and e.get('target')=='inspect-button']
              assert len(events)==1 and events[0]['trusted'] and events[0]['disabled']==False,events
          assert failure['blocked']==[] and failure['errors']==[]
          assert 'consumer: cleanup completed' in negative
          PYCODE
      - name: Preserve only isolated consumer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-consumer-diagnostic
          path: |
            ${{ runner.temp }}/mobile-consumer-diagnostic/*.log
            ${{ runner.temp }}/mobile-consumer-diagnostic/*.json
            ${{ runner.temp }}/mobile-consumer-diagnostic/runtime.txt
            ${{ runner.temp }}/mobile-consumer-diagnostic/codeshell-video-download-qa-*/*.png
          retention-days: 7
          if-no-files-found: warn
