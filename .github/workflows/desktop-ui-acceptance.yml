name: release UI acceptance

# Native package and browser validation without a release identity. No publishing.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Diagnostic scope; release acceptance requires all"
        required: true
        default: all
        type: choice
        options:
          - all
          - web
          - native
  push:
    branches:
      - "codex/desktop/release-ui-acceptance-*"

permissions:
  contents: read

jobs:
  web-ui:
    if: github.event_name != 'workflow_dispatch' || inputs.suite != 'native'
    name: browser authentication, background work and offline UI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "22.16.0"
      - name: install locked dependencies
        timeout-minutes: 15
        run: bun install --frozen-lockfile
      - name: prepare new evidence root
        run: |
          node <<'NODE'
          const { mkdirSync, appendFileSync } = require("node:fs");
          const { join } = require("node:path");
          const root = join(process.env.RUNNER_TEMP, "codeshell-web-ui-acceptance");
          const browsers = join(process.env.RUNNER_TEMP, "codeshell-web-ui-browsers");
          mkdirSync(root, { mode: 0o700 });
          // Both installation and the isolated HOME launch use this owned cache.
          appendFileSync(process.env.GITHUB_ENV, `ACCEPTANCE_ROOT=${root}\nPLAYWRIGHT_BROWSERS_PATH=${browsers}\n`);
          NODE
      - name: image attachment MIME and size regressions
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-bun-test-shard.mjs --timeout 30000 packages/web/src/lib/mobileAttachments.alias-limit.test.ts packages/web/src/lib/mobileAttachments.test.ts 2>&1 | tee "$ACCEPTANCE_ROOT/image-attachments.log"
      - name: browser lifecycle failure and ownership contracts
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-isolated-node-smoke.mjs --test packages/web/scripts/browser-operation-custody.test.mjs packages/web/scripts/service-worker-browser-executable.test.mjs packages/web/scripts/test-auth-boundary-browser.lifecycle.test.mjs packages/web/scripts/test-service-worker-browser.test.mjs 2>&1 | tee "$ACCEPTANCE_ROOT/browser-lifecycle-contracts.log"
      - name: install Chromium and system browser dependencies
        timeout-minutes: 5
        run: node packages/desktop/node_modules/playwright/cli.js install --with-deps chromium
      - name: install display support for actual tab focus
        run: sudo apt-get install -y xvfb
      - name: actual ServiceWorker lifecycle and public offline UI
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-isolated-node-smoke.mjs packages/web/scripts/test-service-worker-browser.mjs --evidence-dir "$ACCEPTANCE_ROOT/service-worker" 2>&1 | tee "$ACCEPTANCE_ROOT/service-worker.log"
      - name: actual authentication and stale-response recovery
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a node scripts/run-isolated-node-smoke.mjs packages/web/scripts/test-auth-boundary-browser.mjs --evidence-dir "$ACCEPTANCE_ROOT/authentication" --headed 2>&1 | tee "$ACCEPTANCE_ROOT/authentication.log"

      - name: actual Web child lifecycle, send, stop and tool-result display
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-isolated-node-smoke.mjs packages/web/scripts/test-subagent-state-browser.mjs --evidence-dir "$ACCEPTANCE_ROOT/subagent-state" 2>&1 | tee "$ACCEPTANCE_ROOT/subagent-state.log"

      - name: actual Desktop annotation input, save and narrow browser layout
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-isolated-node-smoke.mjs packages/desktop/src/renderer/chat/Annotations.browser.fixture.mjs --evidence-dir "$ACCEPTANCE_ROOT/annotations" 2>&1 | tee "$ACCEPTANCE_ROOT/annotations.log"

      - name: expected old-reducer UI failure retains owned browser HOME
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          reducer_ref=a3a735643bf6acd1f53d86bb7c13112a6ca8fd18
          git fetch --no-tags --depth=1 origin "$reducer_ref"
          set +e
          node scripts/run-isolated-node-smoke.mjs packages/web/scripts/test-subagent-state-browser.mjs --evidence-dir "$ACCEPTANCE_ROOT/subagent-state-failure-retention" --reducer-ref "$reducer_ref" 2>&1 | tee "$ACCEPTANCE_ROOT/subagent-state-failure-retention.log"
          retention_pipe_status=("${PIPESTATUS[@]}")
          set -e
          if [[ "${#retention_pipe_status[@]}" -ne 2 || "${retention_pipe_status[0]}" -ne 1 || "${retention_pipe_status[1]}" -ne 0 ]]; then
            echo "Expected the fixed old-reducer UI failure Node=1 and tee=0; got ${retention_pipe_status[*]}"
            exit 1
          fi
          node scripts/run-isolated-node-smoke.mjs packages/web/scripts/verify-subagent-failure-home.mjs "$ACCEPTANCE_ROOT/subagent-state-failure-retention" "$GITHUB_SHA"
      - name: retain public Web UI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-ui-acceptance
          path: |
            ${{ env.ACCEPTANCE_ROOT }}/image-attachments.log
            ${{ env.ACCEPTANCE_ROOT }}/browser-lifecycle-contracts.log
            ${{ env.ACCEPTANCE_ROOT }}/service-worker.log
            ${{ env.ACCEPTANCE_ROOT }}/service-worker/*.png
            ${{ env.ACCEPTANCE_ROOT }}/service-worker/report.json
            ${{ env.ACCEPTANCE_ROOT }}/service-worker/browser-custody.json
            ${{ env.ACCEPTANCE_ROOT }}/service-worker/browser.stdout.log
            ${{ env.ACCEPTANCE_ROOT }}/service-worker/browser.stderr.log
            ${{ env.ACCEPTANCE_ROOT }}/authentication.log
            ${{ env.ACCEPTANCE_ROOT }}/authentication/*.png
            ${{ env.ACCEPTANCE_ROOT }}/authentication/report.json
            ${{ env.ACCEPTANCE_ROOT }}/authentication/browser-custody.json
            ${{ env.ACCEPTANCE_ROOT }}/authentication/browser-stdout.log
            ${{ env.ACCEPTANCE_ROOT }}/authentication/browser-stderr.log
            ${{ env.ACCEPTANCE_ROOT }}/subagent-state.log
            ${{ env.ACCEPTANCE_ROOT }}/subagent-state/receipt.json
            ${{ env.ACCEPTANCE_ROOT }}/subagent-state/*.png
            ${{ env.ACCEPTANCE_ROOT }}/subagent-state/*.log
            ${{ env.ACCEPTANCE_ROOT }}/annotations.log
            ${{ env.ACCEPTANCE_ROOT }}/annotations/receipt.json
            ${{ env.ACCEPTANCE_ROOT }}/annotations/*.png
            ${{ env.ACCEPTANCE_ROOT }}/annotations/*.log
            ${{ env.ACCEPTANCE_ROOT }}/subagent-state-failure-retention.log
            ${{ env.ACCEPTANCE_ROOT }}/subagent-state-failure-retention/receipt.json
            ${{ env.ACCEPTANCE_ROOT }}/subagent-state-failure-retention/retention-verification.json
            ${{ env.ACCEPTANCE_ROOT }}/subagent-state-failure-retention/reducer-frozen.ts
            ${{ env.ACCEPTANCE_ROOT }}/subagent-state-failure-retention/*.png
            ${{ env.ACCEPTANCE_ROOT }}/subagent-state-failure-retention/browser.*.log
          if-no-files-found: error
          retention-days: 7

  native-ui:
    if: github.event_name != 'workflow_dispatch' || inputs.suite != 'web'
    name: native UI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux
            timeout: 45
          - os: macos-latest
            artifact: mac
            timeout: 45
          # Match release.yml's supported node-gyp / Visual Studio compiler.
          - os: windows-2022
            artifact: windows
            timeout: 65
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - uses: actions/setup-node@v7
        with:
          node-version: "22.16.0"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: ensure setuptools for native node-gyp
        run: python -m pip install --upgrade setuptools

      - name: prepare new evidence root
        run: |
          node <<'NODE'
          const { mkdirSync, appendFileSync } = require("node:fs");
          const { join } = require("node:path");
          const root = join(process.env.RUNNER_TEMP, "codeshell-desktop-ui-acceptance");
          mkdirSync(root, { mode: 0o700 });
          appendFileSync(process.env.GITHUB_ENV, `ACCEPTANCE_ROOT=${root}\n`);
          NODE

      - name: Linux display and owned SecretService dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb dbus-x11 gnome-keyring libsecret-tools fontconfig
          record_linux_fonts() {
            node - "$1" <<'NODE'
          const assert = require("node:assert/strict");
          const { execFileSync } = require("node:child_process");
          const { writeFileSync } = require("node:fs");
          const { join } = require("node:path");
          const stage = process.argv[2];
          assert.ok(stage === "before-cjk" || stage === "after-cjk");
          const value = execFileSync("fc-match", ["-f", "%{family}\n%{file}\n%{lang}\n", ":lang=zh-cn"], {
            encoding: "utf8", timeout: 10000, maxBuffer: 16384,
          }).trim();
          const [family, file, languages, ...extra] = value.split("\n");
          assert.ok(family && file && languages && extra.length === 0);
          const supportsChinese = languages.split("|").includes("zh-cn");
          const body = JSON.stringify({
            stage, platform: process.platform, pattern: ":lang=zh-cn", family, file, languages, supportsChinese,
          }, null, 2);
          assert.ok(Buffer.byteLength(body) <= 16384, "Font evidence must remain bounded");
          writeFileSync(join(process.env.ACCEPTANCE_ROOT, `linux-fonts-${stage}.json`), body, { flag: "wx", mode: 0o600 });
          if (stage === "after-cjk") assert.ok(supportsChinese, "CI needs a Chinese-capable font before visual acceptance");
          NODE
          }
          record_linux_fonts before-cjk
          sudo apt-get install -y fonts-noto-cjk
          record_linux_fonts after-cjk

      - name: install locked native dependencies
        timeout-minutes: 15
        run: bun install --frozen-lockfile

      - name: Windows installer ownership and failure contracts
        if: runner.os == 'Windows'
        timeout-minutes: 2
        run: |
          set -euo pipefail
          node scripts/run-isolated-node-smoke.mjs --test packages/desktop/scripts/windows-nsis-acceptance.test.mjs packages/desktop/scripts/packaged-signal-diagnostics.test.mjs packages/desktop/scripts/smoke-windows-nsis-install.test.mjs packages/desktop/scripts/windows-nsis-checkpoint-diagnostics.test.mjs 2>&1 | tee "$ACCEPTANCE_ROOT/windows-nsis-contracts.log"

      - name: Review first-error and cleanup observation contracts
        timeout-minutes: 2
        run: |
          set -euo pipefail
          node scripts/run-isolated-node-smoke.mjs --test packages/desktop/scripts/review-operation-diagnostics.test.mjs 2>&1 | tee "$ACCEPTANCE_ROOT/review-diagnostic-contracts.log"

      - name: Review draft response and session contracts
        timeout-minutes: 2
        run: |
          set -euo pipefail
          node scripts/run-isolated-node-smoke.mjs --test packages/desktop/scripts/review-draft-response-gate.test.mjs 2>&1 | tee "$ACCEPTANCE_ROOT/review-draft-contracts.log"

      - name: verify local package authority and output ownership
        run: node scripts/run-isolated-node-smoke.mjs --test packages/desktop/scripts/smoke-local-package.test.mjs

      # Keep dist readers strictly after each preceding build completes.
      - name: build Desktop workspace dependencies
        timeout-minutes: 15
        run: bun run packages/desktop/scripts/build-workspace-dependencies.ts

      - name: build Desktop
        timeout-minutes: 10
        run: bun run --cwd packages/desktop build

      - name: inspect tracked source after build
        run: |
          git status --porcelain=v1 --untracked-files=no
          git diff --stat

      - name: Write card UTF-8 byte label regressions
        timeout-minutes: 2
        run: |
          set -euo pipefail
          node scripts/run-bun-test-shard.mjs --timeout 30000 packages/desktop/src/renderer/tool-cards/FileToolCard.byte-count.test.tsx 2>&1 | tee "$ACCEPTANCE_ROOT/write-card-byte-count.log"

      - name: completed CRLF and progress output regressions
        timeout-minutes: 2
        run: |
          set -euo pipefail
          node scripts/run-bun-test-shard.mjs --timeout 30000 packages/core/src/runtime/output-clean.test.ts 2>&1 | tee "$ACCEPTANCE_ROOT/output-clean.log"

      - name: file Review aggregation and snapshot scope regressions
        timeout-minutes: 2
        run: |
          set -euo pipefail
          node scripts/run-bun-test-shard.mjs --timeout 30000 packages/desktop/src/renderer/messages/fileChangeAggregator.test.ts packages/desktop/src/renderer/types.test.ts packages/desktop/src/renderer/panels/ReviewPanel.workspace.test.tsx packages/desktop/src/renderer/messages/externalFileTargets.test.tsx packages/desktop/src/renderer/markdown/splitStreamingMarkdown.test.ts packages/desktop/src/renderer/messages/StreamingMarkdown.test.tsx packages/desktop/src/renderer/Markdown.test.tsx packages/desktop/src/renderer/diff/composeFileEdits.test.ts packages/desktop/src/renderer/diff/composeFileEdits.containment.test.ts 2>&1 | tee "$ACCEPTANCE_ROOT/review-file-aggregation.log"

      - name: branch command argument token regressions
        timeout-minutes: 2
        run: |
          set -euo pipefail
          node scripts/run-bun-test-shard.mjs --timeout 30000 packages/tui/src/cli/commands/builtin/branch-command.test.ts 2>&1 | tee "$ACCEPTANCE_ROOT/branch-command.log"

      - name: materialize production workspace packages
        timeout-minutes: 5
        run: bun run --cwd packages/desktop predist

      - name: inspect tracked source after materialization
        run: |
          git status --porcelain=v1 --untracked-files=no
          git diff --stat
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          import { readFileSync } from "node:fs";
          import { createHash } from "node:crypto";
          for (const path of ["packages/desktop/resources/chrome-extension/service-worker.js", "packages/desktop/resources/chrome-extension/service-worker.js.LEGAL.txt"]) {
            const git = (args) => execFileSync("git", args, { encoding: "utf8", timeout: 5000 }).trim();
            const bytes = readFileSync(path);
            console.log(JSON.stringify({ path, normalizedBlobMatchesHead: git(["hash-object", `--path=${path}`, path]) === git(["rev-parse", `HEAD:${path}`]), rawSHA256: createHash("sha256").update(bytes).digest("hex"), crlfLines: bytes.toString("utf8").split("\r\n").length - 1 }));
          }
          NODE

      - name: diagnose Windows fixed process-query transport
        if: runner.os == 'Windows'
        timeout-minutes: 3
        run: node packages/desktop/scripts/diagnose-windows-process-metadata.mjs "$ACCEPTANCE_ROOT/process-metadata"

      - name: verify native process metadata before spawning a package builder
        timeout-minutes: 2
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          import { snapshotElectronTestProcesses } from "./packages/desktop/scripts/electron-test-process-snapshot.mjs";
          const cold = Date.now();
          const rows = snapshotElectronTestProcesses({
            execFile: (file, args, options) => execFileSync(file, args, { ...options, timeout: 30_000 }),
          });
          console.log(JSON.stringify({ phase: "cold-metadata-query", elapsedMs: Date.now() - cold, rows: rows.length }));
          const warm = Date.now();
          const verified = snapshotElectronTestProcesses();
          console.log(JSON.stringify({ phase: "normal-custody-query", elapsedMs: Date.now() - warm, rows: verified.length }));
          NODE

      - name: package native directory without publishing
        timeout-minutes: 12
        run: node packages/desktop/scripts/smoke-local-package.mjs --output "$ACCEPTANCE_ROOT/package"

      - name: configure only the owned Linux Electron sandbox helpers
        if: runner.os == 'Linux'
        working-directory: packages/desktop
        run: |
          set -euo pipefail
          node - "$ACCEPTANCE_ROOT/package/build-receipt.json" <<'NODE' > "$ACCEPTANCE_ROOT/sandbox-paths.txt"
          const { realpathSync, lstatSync, readFileSync } = require("node:fs");
          const { dirname, join } = require("node:path");
          const receipt = JSON.parse(readFileSync(process.argv[2], "utf8"));
          if (receipt.status !== "passed" || receipt.platform !== "linux") throw Error("No successful native Linux package");
          for (const file of [join(dirname(realpathSync(require("electron"))), "chrome-sandbox"), join(receipt.appRoot, "chrome-sandbox")]) {
            if (!lstatSync(file).isFile() || lstatSync(file).isSymbolicLink()) throw Error("Expected owned regular sandbox helper");
            console.log(file);
          }
          NODE
          while IFS= read -r sandbox; do
            sudo chown root:root "$sandbox"
            sudo chmod 4755 "$sandbox"
            test "$(stat -c '%u %a' "$sandbox")" = '0 4755'
          done < "$ACCEPTANCE_ROOT/sandbox-paths.txt"

      - name: source Main cold startup, reload, and second window
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a node scripts/run-isolated-node-smoke.mjs --private-keyring packages/desktop/scripts/e2e-startup-operation-cycles.mjs --evidence-dir "$ACCEPTANCE_ROOT/startup" 2>&1 | tee "$ACCEPTANCE_ROOT/startup.log"
          else
            node scripts/run-isolated-node-smoke.mjs packages/desktop/scripts/e2e-startup-operation-cycles.mjs --evidence-dir "$ACCEPTANCE_ROOT/startup" 2>&1 | tee "$ACCEPTANCE_ROOT/startup.log"
          fi

      - name: actual Review diff lines, rename paths, and file navigation
        timeout-minutes: 3
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a node scripts/run-isolated-node-smoke.mjs --private-keyring packages/desktop/scripts/e2e-review-diff-path-operations.mjs --evidence-dir "$ACCEPTANCE_ROOT/review" 2>&1 | tee "$ACCEPTANCE_ROOT/review.log"
          else
            node scripts/run-isolated-node-smoke.mjs packages/desktop/scripts/e2e-review-diff-path-operations.mjs --evidence-dir "$ACCEPTANCE_ROOT/review" 2>&1 | tee "$ACCEPTANCE_ROOT/review.log"
          fi

      - name: actual Review drafts, scope changes and session isolation
        timeout-minutes: 3
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a node scripts/run-isolated-node-smoke.mjs --private-keyring packages/desktop/scripts/e2e-review-draft-operations.mjs --evidence-dir "$ACCEPTANCE_ROOT/review-drafts" 2>&1 | tee "$ACCEPTANCE_ROOT/review-draft-operations.log"
          else
            node scripts/run-isolated-node-smoke.mjs packages/desktop/scripts/e2e-review-draft-operations.mjs --evidence-dir "$ACCEPTANCE_ROOT/review-drafts" 2>&1 | tee "$ACCEPTANCE_ROOT/review-draft-operations.log"
          fi

      - name: actual file mentions, Git, browser guests, and PTY operations
        timeout-minutes: 8
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a node scripts/run-isolated-node-smoke.mjs --private-keyring packages/desktop/scripts/e2e-panel-operation-cycles.mjs --evidence-dir "$ACCEPTANCE_ROOT/panels" 2>&1 | tee "$ACCEPTANCE_ROOT/panels.log"
          else
            node scripts/run-isolated-node-smoke.mjs packages/desktop/scripts/e2e-panel-operation-cycles.mjs --evidence-dir "$ACCEPTANCE_ROOT/panels" 2>&1 | tee "$ACCEPTANCE_ROOT/panels.log"
          fi

      - name: actual composer input and reference revocation
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a node scripts/run-isolated-node-smoke.mjs --private-keyring packages/desktop/scripts/e2e-composer-reference-operations.mjs --evidence-dir "$ACCEPTANCE_ROOT/composer" 2>&1 | tee "$ACCEPTANCE_ROOT/composer.log"
          else
            node scripts/run-isolated-node-smoke.mjs packages/desktop/scripts/e2e-composer-reference-operations.mjs --evidence-dir "$ACCEPTANCE_ROOT/composer" 2>&1 | tee "$ACCEPTANCE_ROOT/composer.log"
          fi

      - name: actual memory pin persistence and late completion
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a node scripts/run-isolated-node-smoke.mjs --private-keyring packages/desktop/scripts/e2e-memory-pin-operation-cycles.mjs --evidence-dir "$ACCEPTANCE_ROOT/memory" 2>&1 | tee "$ACCEPTANCE_ROOT/memory.log"
          else
            node scripts/run-isolated-node-smoke.mjs packages/desktop/scripts/e2e-memory-pin-operation-cycles.mjs --evidence-dir "$ACCEPTANCE_ROOT/memory" 2>&1 | tee "$ACCEPTANCE_ROOT/memory.log"
          fi

      - name: actual language and system-theme multiwindow persistence
        timeout-minutes: 6
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a node scripts/run-isolated-node-smoke.mjs --private-keyring packages/desktop/scripts/e2e-preferences-operation-cycles.mjs --evidence-dir "$ACCEPTANCE_ROOT/preferences" 2>&1 | tee "$ACCEPTANCE_ROOT/preferences.log"
          else
            node scripts/run-isolated-node-smoke.mjs packages/desktop/scripts/e2e-preferences-operation-cycles.mjs --evidence-dir "$ACCEPTANCE_ROOT/preferences" 2>&1 | tee "$ACCEPTANCE_ROOT/preferences.log"
          fi

      - name: actual packaged Main, preload, and renderer UI
        timeout-minutes: 8
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a node packages/desktop/scripts/run-packaged-ui-acceptance.mjs --build-receipt "$ACCEPTANCE_ROOT/package/build-receipt.json" --evidence-dir "$ACCEPTANCE_ROOT/ui" 2>&1 | tee "$ACCEPTANCE_ROOT/packaged-ui.log"
          else
            node packages/desktop/scripts/run-packaged-ui-acceptance.mjs --build-receipt "$ACCEPTANCE_ROOT/package/build-receipt.json" --evidence-dir "$ACCEPTANCE_ROOT/ui" 2>&1 | tee "$ACCEPTANCE_ROOT/packaged-ui.log"
          fi

      - name: build real Linux AppImage from the verified directory payload
        if: runner.os == 'Linux'
        timeout-minutes: 12
        run: |
          set -euo pipefail
          node packages/desktop/scripts/build-local-appimage.mjs --build-receipt "$ACCEPTANCE_ROOT/package/build-receipt.json" --output "$ACCEPTANCE_ROOT/appimage" 2>&1 | tee "$ACCEPTANCE_ROOT/appimage-build.log"

      - name: actual packaged update checks and recovery
        timeout-minutes: 8
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a node packages/desktop/scripts/run-packaged-ui-acceptance.mjs --build-receipt "$ACCEPTANCE_ROOT/package/build-receipt.json" --evidence-dir "$ACCEPTANCE_ROOT/updater" --fixture updater --appimage-build-receipt "$ACCEPTANCE_ROOT/appimage/appimage-build-receipt.json" 2>&1 | tee "$ACCEPTANCE_ROOT/updater.log"
          else
            node packages/desktop/scripts/run-packaged-ui-acceptance.mjs --build-receipt "$ACCEPTANCE_ROOT/package/build-receipt.json" --evidence-dir "$ACCEPTANCE_ROOT/updater" --fixture updater 2>&1 | tee "$ACCEPTANCE_ROOT/updater.log"
          fi

      - name: production macOS DMG owned installation and replacement
        if: runner.os == 'macOS'
        timeout-minutes: 12
        run: |
          set -euo pipefail
          node scripts/run-isolated-node-smoke.mjs packages/desktop/scripts/smoke-macos-dmg-install.mjs --build-receipt "$ACCEPTANCE_ROOT/package/build-receipt.json" --output "$ACCEPTANCE_ROOT/dmg" 2>&1 | tee "$ACCEPTANCE_ROOT/dmg.log"

      # Preserve already-completed Windows native evidence before the installer.
      - name: retain Windows native evidence before NSIS
        if: runner.os == 'Windows'
        timeout-minutes: 3
        uses: actions/upload-artifact@v7
        with:
          name: desktop-ui-native-before-nsis-${{ matrix.artifact }}
          path: |
            ${{ env.ACCEPTANCE_ROOT }}/package/build-receipt.json
            ${{ env.ACCEPTANCE_ROOT }}/package/electron-builder.local.json
            ${{ env.ACCEPTANCE_ROOT }}/package/build.log
            ${{ env.ACCEPTANCE_ROOT }}/process-metadata/report.json
            ${{ env.ACCEPTANCE_ROOT }}/startup.log
            ${{ env.ACCEPTANCE_ROOT }}/write-card-byte-count.log
            ${{ env.ACCEPTANCE_ROOT }}/output-clean.log
            ${{ env.ACCEPTANCE_ROOT }}/review-file-aggregation.log
            ${{ env.ACCEPTANCE_ROOT }}/branch-command.log
            ${{ env.ACCEPTANCE_ROOT }}/startup/receipt.json
            ${{ env.ACCEPTANCE_ROOT }}/startup/cycle-*.json
            ${{ env.ACCEPTANCE_ROOT }}/startup/*.png
