      - name: production Windows NSIS installation, replacement and uninstall
        if: runner.os == 'Windows'
        timeout-minutes: 40
        run: |
          set -euo pipefail
          node packages/desktop/scripts/smoke-windows-nsis-install.mjs --build-receipt "$ACCEPTANCE_ROOT/package/build-receipt.json" --evidence-dir "$ACCEPTANCE_ROOT/windows-nsis" 2>&1 | tee "$ACCEPTANCE_ROOT/windows-nsis.log"

