name: ci

on:
  push:
    branches: [main]
  pull_request:

# Standard §S7 + Gate 4: the gates this workflow protects are
#   - safety guards (engine-bypass scan, sandbox tests, SSRF tests)
#   - correctness (chat-session isolation, cwd consistency)
#   - typecheck no-new-errors (clean baseline today; locked here)
#   - SDK smoke (the public API contract from B3)
# Anything that goes red here blocks merges to main.

jobs:
  guards:
    name: guards (engine-bypass + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - name: install
        run: bun install --frozen-lockfile
      - name: engine-bypass guard
        run: bash scripts/check-no-engine-bypass.sh
      - name: lint
        run: bun run lint
      # Ratchet: 0 errors always, and the warning count may fall but never rise.
      # A ~130-warning pile hides new ones; this keeps it shrinking instead.
      - name: lint warning baseline
        run: bun run lint:baseline

  typecheck:
    name: typecheck (all workspaces)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - name: install
        run: bun install --frozen-lockfile
      - name: typecheck
        # The root command first establishes package declaration boundaries, so
        # this also works on a clean checkout before the no-emit workspace pass.
        run: bun run typecheck

  # The suite is split across parallel shards rather than run as one job.
  #
  # WHY: bun runs every file of an invocation in ONE process, so a 10k-test
  # invocation makes files contend for that process. On this runner the single
  # full-suite job took ~650s and dragged unrelated suites past the 30s
  # per-test timeout — five suites (engine auto-compaction, profile ceiling,
  # prompt-cache, petWalkFrames, SettingsPage) failed purely on time while
  # passing in 2-3s when run alone. That reads as broken code and is not.
  #
  # Shard boundaries follow measured cost, not package tidiness:
  #   core     3781 tests / 566 files / ~120s
  #   desktop  3331 tests / 443 files / ~83s
  #   rest     the remaining packages plus tests/, ~62s + change
  # Each shard keeps the repository-scoped entry point so project-local
  # .agents Skills cannot inject upstream tests, and each stays well inside
  # the per-test timeout with headroom for a slower runner.
  tests:
    name: tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      # One shard's failure must not cancel the others: a red CI should show
      # every failing area at once, not just whichever tripped first.
      fail-fast: false
      matrix:
        include:
          # Whole package dirs, not `<pkg>/src`: three suites live outside src
          # (web/app, desktop/tests, desktop/scripts) and scoping to src would
          # silently drop 48 tests while still reporting green.
          #
          # core is split three ways because scope size — not the tests — is
          # what fails. Measured on this runner: the three engine suites that
          # time out pass in 0.99s alone, the whole engine dir in 3.4s, and
          # engine + tool-system (1469 tests) in 8.6s, yet the undivided
          # `packages/core` takes 553s and times those same tests out at 30s
          # each. Keeping each invocation small keeps them fast.
          - shard: core-engine
            paths: packages/core/src/engine packages/core/src/tool-system
          # Exclusion, not an enumerated list: a hand-written directory list
          # silently drops any subtree or top-level test file added later, and
          # bun errors out entirely if one listed path has no tests.
          - shard: core-rest
            paths: packages/core
            ignore: "--path-ignore-patterns **/src/engine/** --path-ignore-patterns **/src/tool-system/**"
          - shard: desktop
            paths: packages/desktop
          - shard: rest
            paths: >-
              tests packages/coding packages/tui packages/pet packages/server
              packages/chat packages/web packages/arena packages/cdp
              packages/link
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - name: install
        run: bun install --frozen-lockfile
      # Windows and other focused jobs still list literal paths. Keep their
      # references checked even though this Linux job now runs the full suite.
      - name: verify workflow test paths exist
        run: bun run lint:workflow-test-paths
      # A few integration paths intentionally resolve workspace packages through
      # their public export maps. Build those exports so a fresh checkout tests
      # the same package boundary that consumers receive.
      - name: build workspace packages
        run: bun run build
      - name: test shard
        run: bun test --timeout 30000 ${{ matrix.ignore }} ${{ matrix.paths }}

  coverage:
    name: builtin integration coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - name: install
        run: bun install --frozen-lockfile
      - name: ToolRegistry harness + builtin coverage gates
        run: bun run test:coverage

  electron-e2e:
    name: Electron E2E (provider + panels + plugin sandbox)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - name: install
        run: bun install --frozen-lockfile
      - name: build runtime and desktop
        run: |
          bun run build
          bun run --cwd packages/desktop build
      - name: real Electron E2E
        run: xvfb-run -a bun run --cwd packages/desktop test:e2e

  tests-windows:
    name: tests (windows port — real win32)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - name: install
        run: bun install --frozen-lockfile
      - name: windows-port unit suites
        # The win32 code paths (shell selection, taskkill, PATHEXT resolution,
        # case-insensitive paths, CRLF, sandbox fail-open) are only mock-tested
        # on the macOS/Linux dev box (process.platform is redefined). Run the
        # SAME suites on a real Windows host so the actual branches execute.
        run: |
          bun test --timeout 30000 `
            packages/core/src/runtime/shell-invocation.test.ts `
            packages/core/src/runtime/kill-win32.test.ts `
            packages/core/src/tool-system/path-policy-win32.test.ts `
            packages/core/src/tool-system/builtin/crlf.test.ts `
            packages/core/src/tool-system/sandbox/sandbox-win32.test.ts `
            packages/core/src/utils/exec.test.ts `
            packages/server/src/mobile-remote/cloudflared-binary.test.ts
