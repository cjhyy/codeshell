name: ci
# Diagnostic branch only (never merged): do the new upstream node:http tests catch the
# TCP_DEFER_ACCEPT behaviour on Linux with released Bun?
on:
  workflow_dispatch:
jobs:
  t:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rt: ["1.4.5", "canary"]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.rt }}
      - run: bun --version
      - name: new tests only
        continue-on-error: true
        run: cd diag && bun test --timeout 10000 ./node-http-server-timeouts.test.ts -t "never sends|sent nothing"
      - name: whole file
        continue-on-error: true
        run: cd diag && bun test --timeout 10000 ./node-http-server-timeouts.test.ts
